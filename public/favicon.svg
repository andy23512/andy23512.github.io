<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <defs>
        <radialGradient id="glow">
            <stop offset="0" stop-color="#fde047" stop-opacity=".55" />
            <stop offset="1" stop-color="#fde047" stop-opacity="0" />
        </radialGradient>
    </defs>

    <!-- The night sky the chart is drawn on. -->
    <circle cx="16" cy="16" r="16" fill="#0d1424" />

    <!-- Limb and one meridian of the celestial sphere. -->
    <g fill="none" stroke="#93c5fd" stroke-width="1">
        <circle cx="16" cy="16" r="15" opacity=".38" />
        <ellipse cx="16" cy="16" rx="6.5" ry="15" opacity=".22" />
    </g>

    <!-- Faint background stars. -->
    <g fill="#e2f0ff">
        <circle cx="8" cy="8.5" r=".7" opacity=".75" />
        <circle cx="24.5" cy="10" r=".55" opacity=".6" />
        <circle cx="9.5" cy="24" r=".55" opacity=".6" />
        <circle cx="23" cy="23.5" r=".7" opacity=".75" />
    </g>

    <!-- The lit star, matching the highlight on the page. -->
    <circle cx="16" cy="16" r="10.5" fill="url(#glow)" />
    <path
        fill="#fde047"
        d="M16 6c.6 6.9 3.1 9.4 10 10-6.9.6-9.4 3.1-10 10-.6-6.9-3.1-9.4-10-10 6.9-.6 9.4-3.1 10-10Z"
    />
</svg>
